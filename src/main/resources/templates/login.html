<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - LaundryforU</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .logo-icon { text-align: center; font-size: 40px; margin-bottom: 10px; }
        h2 { color: #1e293b; margin-bottom: 25px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { border-color: #2563eb; outline: none; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.3s, transform 0.2s; }
        button:hover { background: #1d4ed8; transform: translateY(-2px); }
        p { font-size: 14px; color: #64748b; text-align: center; margin-top: 15px; }
        a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo-icon">🧺</div>
        <h2>Login</h2>
        <form action="/login" method="post">
    <input type="text" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Masuk</button>
</form>
        <p>Belum punya akun? <a href="/daftar">Daftar</a></p>
    </div>
</body>
</html>
