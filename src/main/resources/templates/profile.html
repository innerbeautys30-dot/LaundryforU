<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profil - LaundryforU</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#2563eb; --muted:#64748b; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#f8fafc;color:#0f172a}
    .container{max-width:1120px;margin:0 auto;padding:32px 20px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
    .topbar a{padding:10px 14px;border-radius:12px;background:#fff;border:1px solid #e5e7eb;color:#334155;text-decoration:none;font-weight:600}
    .topbar a:hover{border-color:var(--accent);color:var(--accent)}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:22px}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .profile h1{font-size:26px;font-weight:700}
    .profile p{margin:6px 0 0;color:var(--muted)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .row .k{font-size:12px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
    .row .v{font-size:15px;font-weight:600;margin-top:4px}
    .empty{text-align:center;color:var(--muted);padding:18px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;text-decoration:none}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb;color:#334155}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div></div>
      <a href="/home">Kembali ke Dashboard</a>
    </div>

    <div class="grid">
      <div class="card profile">
        <h1 th:text="${user.username}">Nama Pengguna</h1>
        <p th:text="${user.email}">email</p>
        <div class="row">
          <div><div class="k">Username</div><div class="v" th:text="${user.username}">-</div></div>
          <div><div class="k">Email</div><div class="v" th:text="${user.email}">-</div></div>
          <div><div class="k">Role</div><div class="v" th:text="${user.role}">-</div></div>
          <div><div class="k">Status Akun</div><div class="v" style="color:#15803d">Aktif</div></div>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px">Aksi</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <a href="/home" class="btn btn-primary">📋 Lihat Riwayat Pesanan</a>
          <a href="/buat-pesanan" class="btn btn-ghost">➕ Buat Pesanan Baru</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
