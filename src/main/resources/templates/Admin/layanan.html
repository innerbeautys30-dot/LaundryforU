<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harga & Layanan - LaundryforU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .sidebar { background: white; border-right: 1px solid #e5e7eb; }
    </style>
</head>
<body class="flex">

    <aside class="sidebar w-64 h-screen fixed p-6 hidden md:block">
        <a href="/admin/dashboard" class="text-2xl font-bold text-blue-600 mb-10 block">LaundryforU</a>
        <nav class="space-y-2">
            <a href="/admin/dashboard" class="flex items-center p-3 bg-blue-50 text-blue-700 rounded-xl font-medium">🧺 Dashboard</a>
            <a href="/admin/pesanan" class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">📦 Kelola Pesanan</a>
            <a href="/admin/konfirmasi-pesanan" class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-xl transition relative">
                <span>📋 Konfirmasi Pesanan</span>
                <span class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full" th:text="${pendingKonfirmasi}">0</span>
            </a>
            <a href="/admin/konfirmasi-pembayaran" class="flex items-center p-3 text-gray-600 hover:bg-gray-50 rounded-xl transition relative">
                <span>💳 Konfirmasi Pembayaran</span>
                <span class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full" th:text="${pendingPembayaran}">0</span>
            </a>
            <a href="/logout" class="flex items-center p-3 text-red-500 hover:bg-red-50 rounded-xl transition mt-10">🚪 LogOut</a>
        </nav>
    </aside>

    <main class="ml-0 md:ml-64 p-8 w-full">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Harga & Layanan</h1>
            <p class="text-gray-500">Kelola daftar layanan dan harga per kg.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4" th:text="${layanan != null ? 'Edit Layanan' : 'Tambah Layanan'}">Tambah Layanan</h3>
                <form th:if="${layanan == null}" th:action="@{'/admin/layanan/tambah'}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Layanan</label>
                        <input type="text" name="namaLayanan" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Harga per Kg (Rp)</label>
                        <input type="number" name="harga" required min="0" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                        <textarea name="deskripsi" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-700 shadow-lg shadow-blue-200 transition w-full">Tambah Layanan</button>
                </form>
                <form th:if="${layanan != null}" th:action="@{'/admin/layanan/update/' + ${layanan.id}}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Layanan</label>
                        <input type="text" name="namaLayanan" th:value="${layanan.namaLayanan}" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Harga per Kg (Rp)</label>
                        <input type="number" name="harga" th:value="${layanan.harga}" required min="0" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                        <textarea name="deskripsi" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500" th:text="${layanan.deskripsi}"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-700 shadow-lg shadow-blue-200 transition w-full">Update Layanan</button>
                    <a href="/admin/layanan" class="block text-center text-sm text-gray-500 hover:text-blue-600 mt-2">Batal Edit</a>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b border-gray-50">
                    <h3 class="font-bold text-gray-800">Daftar Layanan</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="p-4 text-sm text-gray-600">Nama Layanan</th>
                                <th class="p-4 text-sm text-gray-600">Harga/Kg</th>
                                <th class="p-4 text-sm text-gray-600">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                            <tr th:each="l : ${layananList}" class="hover:bg-gray-50 transition">
                                <td class="p-4 font-medium text-gray-800" th:text="${l.namaLayanan}">-</td>
                                <td class="p-4 text-gray-800 font-semibold" th:text="'Rp ' + ${l.harga}">-</td>
                                <td class="p-4 flex gap-3">
                                    <a th:href="@{'/admin/layanan/edit/' + ${l.id}}" class="text-blue-600 font-medium text-sm">Edit</a>
                                    <a th:href="@{'/admin/layanan/hapus/' + ${l.id}}" class="text-red-500 font-medium text-sm" onclick="return confirm('Yakin hapus layanan?')">Hapus</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(layananList)}">
                                <td colspan="3" class="p-8 text-center text-gray-500">Belum ada layanan. Tambahkan layanan pertama Anda.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
