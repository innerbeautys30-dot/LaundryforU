<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Notifikasi Pembayaran - Admin</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 24px; color: #0f172a; }
    .container { max-width: 900px; margin: 0 auto; }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .muted { color: #64748b; font-size: 13px; }
    .pill { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #dbeafe; color: #0c4a6e; display: inline-block; }
    .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid #e5e7eb; background: white; color: #334155; font-weight: 600; text-decoration: none; }
    .btn:hover { border-color: #2563eb; color: #2563eb; }
    .empty { text-align: center; color: #64748b; padding: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row" style="margin-bottom: 18px;">
      <h2>Notifikasi Pembayaran</h2>
      <a href="/admin" class="btn">← Kembali ke Dashboard</a>
    </div>
    <div th:if="${#lists.isEmpty(notifications)}" class="empty">Belum ada notifikasi pembayaran.</div>
    <div th:each="n : ${notifications}" class="card">
      <div class="row">
        <div>
          <div style="font-weight:700; color:#0f172a;" th:text="${n.title}">-</div>
          <div class="muted" th:text="${n.message}">-</div>
          <div class="muted" th:text="${n.createdAt}">-</div>
        </div>
        <span class="pill" th:text="${n.read ? 'Dibaca' : 'Baru'}">-</span>
      </div>
    </div>
  </div>
</body>
</html>
